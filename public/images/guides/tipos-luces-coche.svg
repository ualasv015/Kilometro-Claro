<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Cuatro tecnologías de iluminación del coche</title>
  <desc id="desc">Esquema editorial con faros halógenos, xenón, LED y láser. Los haces son ilustrativos y no están a escala.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#153e34"/><stop offset="1" stop-color="#0d2c26"/></linearGradient>
    <linearGradient id="beam" x1="0" x2="1"><stop stop-color="#d8f36a" stop-opacity=".58"/><stop offset="1" stop-color="#d8f36a" stop-opacity="0"/></linearGradient>
    <linearGradient id="beamBlue" x1="0" x2="1"><stop stop-color="#a9f3e1" stop-opacity=".62"/><stop offset="1" stop-color="#a9f3e1" stop-opacity="0"/></linearGradient>
    <filter id="soft"><feGaussianBlur stdDeviation="15"/></filter>
  </defs>
  <rect width="1600" height="900" rx="38" fill="url(#bg)"/>
  <circle cx="1375" cy="142" r="180" fill="#d8f36a" opacity=".06"/>
  <text x="90" y="112" fill="#d8f36a" font-family="Arial,sans-serif" font-size="20" font-weight="700" letter-spacing="4">KILÓMETRO CLARO · GUÍA VISUAL</text>
  <text x="90" y="190" fill="#f4f5eb" font-family="Arial,sans-serif" font-size="57" font-weight="700">No solo importa la bombilla</text>
  <text x="92" y="235" fill="#c2d5cb" font-family="Arial,sans-serif" font-size="24">Fuente luminosa, óptica y control del haz trabajan juntos.</text>
  <g transform="translate(80 310)">
    <rect width="340" height="430" rx="22" fill="#214d41" stroke="#3a6758" stroke-width="2"/>
    <text x="28" y="56" fill="#d8f36a" font-family="Arial,sans-serif" font-size="18" font-weight="700" letter-spacing="2">01</text>
    <text x="28" y="104" fill="#fff" font-family="Arial,sans-serif" font-size="29" font-weight="700">Halógena</text>
    <g transform="translate(30 158)"><path d="M30 122 Q69 51 117 53 L117 190 Q69 191 30 122Z" fill="#ddf5a0" opacity=".93"/><path d="M108 72 L287 20 L287 222 L108 170Z" fill="url(#beam)"/><path d="M32 122 Q70 53 117 53 L117 190 Q69 190 32 122Z" fill="none" stroke="#f3f7e6" stroke-width="7"/></g>
    <text x="28" y="365" fill="#d6e1da" font-family="Arial,sans-serif" font-size="17">Filamento incandescente</text>
    <text x="28" y="393" fill="#a9beb3" font-family="Arial,sans-serif" font-size="15">Recambio sencillo en muchos modelos</text>
  </g>
  <g transform="translate(455 310)">
    <rect width="340" height="430" rx="22" fill="#214d41" stroke="#3a6758" stroke-width="2"/>
    <text x="28" y="56" fill="#d8f36a" font-family="Arial,sans-serif" font-size="18" font-weight="700" letter-spacing="2">02</text>
    <text x="28" y="104" fill="#fff" font-family="Arial,sans-serif" font-size="29" font-weight="700">Xenón / HID</text>
    <g transform="translate(30 158)"><path d="M30 122 Q69 51 117 53 L117 190 Q69 191 30 122Z" fill="#b4f4e6" opacity=".93"/><path d="M108 72 L287 20 L287 222 L108 170Z" fill="url(#beamBlue)"/><path d="M32 122 Q70 53 117 53 L117 190 Q69 190 32 122Z" fill="none" stroke="#e6fff7" stroke-width="7"/><path d="M69 92 Q91 122 69 152" fill="none" stroke="#fff" stroke-width="6" stroke-linecap="round"/></g>
    <text x="28" y="365" fill="#d6e1da" font-family="Arial,sans-serif" font-size="17">Arco eléctrico en gas</text>
    <text x="28" y="393" fill="#a9beb3" font-family="Arial,sans-serif" font-size="15">Usa balasto y control electrónico</text>
  </g>
  <g transform="translate(830 310)">
    <rect width="340" height="430" rx="22" fill="#214d41" stroke="#3a6758" stroke-width="2"/>
    <text x="28" y="56" fill="#d8f36a" font-family="Arial,sans-serif" font-size="18" font-weight="700" letter-spacing="2">03</text>
    <text x="28" y="104" fill="#fff" font-family="Arial,sans-serif" font-size="29" font-weight="700">LED · Matrix</text>
    <g transform="translate(30 158)"><path d="M30 122 Q69 51 117 53 L117 190 Q69 191 30 122Z" fill="#e7f8a3" opacity=".93"/><path d="M108 72 L287 20 L287 222 L108 170Z" fill="url(#beam)"/><path d="M32 122 Q70 53 117 53 L117 190 Q69 190 32 122Z" fill="none" stroke="#f3f7e6" stroke-width="7"/><path d="M178 51v141M208 42v161M238 34v177" stroke="#143b31" stroke-width="8" opacity=".55"/></g>
    <text x="28" y="365" fill="#d6e1da" font-family="Arial,sans-serif" font-size="17">Diodos y control del haz</text>
    <text x="28" y="393" fill="#a9beb3" font-family="Arial,sans-serif" font-size="15">Matrix atenúa zonas concretas</text>
  </g>
  <g transform="translate(1205 310)">
    <rect width="315" height="430" rx="22" fill="#214d41" stroke="#3a6758" stroke-width="2"/>
    <text x="28" y="56" fill="#d8f36a" font-family="Arial,sans-serif" font-size="18" font-weight="700" letter-spacing="2">04</text>
    <text x="28" y="104" fill="#fff" font-family="Arial,sans-serif" font-size="29" font-weight="700">Láser</text>
    <g transform="translate(20 158)"><path d="M30 122 Q69 51 117 53 L117 190 Q69 191 30 122Z" fill="#e7f8a3" opacity=".93"/><path d="M108 96 L285 84 L285 160 L108 148Z" fill="url(#beam)"/><path d="M32 122 Q70 53 117 53 L117 190 Q69 190 32 122Z" fill="none" stroke="#f3f7e6" stroke-width="7"/><path d="M142 120h130" stroke="#d8f36a" stroke-width="5" stroke-dasharray="7 9"/></g>
    <text x="28" y="365" fill="#d6e1da" font-family="Arial,sans-serif" font-size="17">Apoyo de largas</text>
    <text x="28" y="393" fill="#a9beb3" font-family="Arial,sans-serif" font-size="15">Con conversión a luz blanca</text>
  </g>
  <text x="90" y="810" fill="#b7c8be" font-family="Arial,sans-serif" font-size="18">Los haces son ilustrativos, no están a escala: el faro completo determina el resultado.</text>
</svg>
