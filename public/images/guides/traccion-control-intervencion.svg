<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
<title id="title">Posible intervención del control de tracción</title><desc id="desc">Los sensores informan de un giro excesivo de una rueda motriz. La centralita puede reducir el par motriz, frenar selectivamente la rueda o combinar intervenciones para aprovechar el agarre que queda.</desc>
<rect width="960" height="540" rx="24" fill="#f1f6ef"/><text x="45" y="61" fill="#193e34" font-size="30" font-family="Arial,sans-serif" font-weight="700">Cuando una rueda motriz gira de más</text><text x="45" y="93" fill="#53675d" font-size="18" font-family="Arial,sans-serif">Secuencia posible del control de tracción; depende del vehículo</text>
<g font-family="Arial,sans-serif" text-anchor="middle"><rect x="48" y="165" width="244" height="176" rx="17" fill="#fff" stroke="#a9c9b1" stroke-width="3"/><text x="170" y="216" fill="#1b5f4d" font-size="23" font-weight="700">Sensores</text><text x="170" y="255" fill="#465c4e" font-size="18">Velocidad de ruedas</text><text x="170" y="281" fill="#465c4e" font-size="18">y otras señales</text><rect x="358" y="165" width="244" height="176" rx="17" fill="#fff" stroke="#a9c9b1" stroke-width="3"/><text x="480" y="216" fill="#1b5f4d" font-size="23" font-weight="700">Centralita</text><text x="480" y="255" fill="#465c4e" font-size="18">Estima el giro</text><text x="480" y="281" fill="#465c4e" font-size="18">excesivo</text><rect x="668" y="165" width="244" height="176" rx="17" fill="#fff" stroke="#a9c9b1" stroke-width="3"/><text x="790" y="213" fill="#1b5f4d" font-size="22" font-weight="700">Intervención</text><text x="790" y="249" fill="#465c4e" font-size="17">Menos par y/o freno</text><text x="790" y="275" fill="#465c4e" font-size="17">en una rueda</text></g>
<g stroke="#7fa829" stroke-width="7" stroke-linecap="round"><path d="M302 253h42M612 253h42"/></g><g fill="#7fa829"><path d="m352 253-18-13v26z"/><path d="m662 253-18-13v26z"/></g><rect x="211" y="393" width="538" height="69" rx="17" fill="#dbead4"/><text x="480" y="438" fill="#2d5639" font-size="20" font-family="Arial,sans-serif" text-anchor="middle" font-weight="700">Objetivo: aprovechar el agarre disponible</text><text x="45" y="508" fill="#53675d" font-size="17" font-family="Arial,sans-serif">No crea adherencia ni garantiza el control en cualquier superficie.</text>
</svg>
