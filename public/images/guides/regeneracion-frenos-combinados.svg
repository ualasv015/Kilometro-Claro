<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
  <title id="title">Una frenada puede combinar regeneración y fricción</title><desc id="desc">El conductor pide decelerar con el pedal. El controlador asigna una parte posible al motor generador, que devuelve energía a la batería, y el resto necesario a los frenos de fricción, que disipan calor. El reparto depende de las condiciones.</desc>
  <rect width="960" height="540" rx="20" fill="#f1f5ed"/>
  <g font-family="Arial,sans-serif"><text x="42" y="59" fill="#173d34" font-size="32" font-weight="700">Al pisar el freno puede haber dos vías</text><text x="42" y="92" fill="#496154" font-size="17">Reparto variable según el coche y la situación; no es una proporción fija</text></g>
  <g font-family="Arial,sans-serif" font-size="21" font-weight="700" text-anchor="middle"><rect x="44" y="218" width="184" height="105" rx="14" fill="#173d34"/><text x="136" y="262" fill="#fff">Pedal de</text><text x="136" y="290" fill="#fff">freno</text><rect x="307" y="218" width="184" height="105" rx="14" fill="#d7f36a"/><text x="399" y="262" fill="#173d34">Control de</text><text x="399" y="290" fill="#173d34">frenada</text><rect x="598" y="140" width="313" height="106" rx="14" fill="#cfe7d9"/><text x="754" y="184" fill="#173d34">Motor generador</text><text x="754" y="213" fill="#173d34">→ batería</text><rect x="598" y="309" width="313" height="106" rx="14" fill="#e4e2d8"/><text x="754" y="353" fill="#173d34">Frenos de fricción</text><text x="754" y="382" fill="#173d34">→ calor</text></g>
  <g stroke="#4d8c6c" stroke-width="6" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M237 270h54m-13-12 13 12-13 12M500 270h44v-77h38m-13-12 13 12-13 12M500 270h44v92h38m-13-12 13 12-13 12"/></g>
  <text x="42" y="469" fill="#496154" font-family="Arial,sans-serif" font-size="16">Si la batería no admite carga o hace falta más deceleración, puede crecer la parte de fricción.</text>
  <text x="42" y="510" fill="#667e6f" font-family="Arial,sans-serif" font-size="14">Ilustración original de Kilómetro Claro · 2026</text>
</svg>
