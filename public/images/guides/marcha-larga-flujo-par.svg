<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
<title id="title">Del pedal a la aceleración</title><desc id="desc">El pedal comunica una solicitud de par, el motor entrega el par disponible, la caja transforma ese giro y las ruedas deben superar pendiente, rodadura y aire para acelerar.</desc>
<rect width="960" height="540" rx="24" fill="#edf4ef"/><text x="48" y="68" fill="#153d34" font-size="32" font-family="Arial,sans-serif" font-weight="700">Del pie a la carretera</text><text x="48" y="103" fill="#53685e" font-size="18" font-family="Arial,sans-serif">Pisar más expresa una demanda; no fija por sí solo la aceleración</text>
<g font-family="Arial,sans-serif" text-anchor="middle"><rect x="47" y="166" width="185" height="125" rx="16" fill="#fff" stroke="#abcdb5" stroke-width="2"/><text x="139" y="210" fill="#174b3e" font-size="23" font-weight="700">Pedal</text><text x="139" y="245" fill="#43594c" font-size="17">Solicita par</text><rect x="276" y="166" width="185" height="125" rx="16" fill="#fff" stroke="#abcdb5" stroke-width="2"/><text x="368" y="210" fill="#174b3e" font-size="23" font-weight="700">Motor</text><text x="368" y="245" fill="#43594c" font-size="17">Par disponible</text><rect x="505" y="166" width="185" height="125" rx="16" fill="#fff" stroke="#abcdb5" stroke-width="2"/><text x="597" y="210" fill="#174b3e" font-size="23" font-weight="700">Caja</text><text x="597" y="245" fill="#43594c" font-size="17">Relación elegida</text><rect x="734" y="166" width="185" height="125" rx="16" fill="#fff" stroke="#abcdb5" stroke-width="2"/><text x="826" y="210" fill="#174b3e" font-size="23" font-weight="700">Ruedas</text><text x="826" y="245" fill="#43594c" font-size="17">Fuerza motriz</text></g>
<g fill="none" stroke="#75a12b" stroke-width="6" stroke-linecap="round"><path d="M236 229h33"/><path d="M465 229h33"/><path d="M694 229h33"/></g><g fill="#75a12b"><path d="m270 229-12-9v18z"/><path d="m499 229-12-9v18z"/><path d="m728 229-12-9v18z"/></g>
<path d="M826 297v52" fill="none" stroke="#75a12b" stroke-width="6"/><path d="m826 361-10-14h20z" fill="#75a12b"/><rect x="265" y="374" width="624" height="93" rx="16" fill="#dce9d9"/><text x="577" y="408" fill="#174b3e" font-size="21" font-family="Arial,sans-serif" text-anchor="middle" font-weight="700">¿Queda fuerza para ganar velocidad?</text><text x="577" y="441" fill="#43594c" font-size="18" font-family="Arial,sans-serif" text-anchor="middle">Pendiente + rodadura + aire + carga del vehículo</text><text x="48" y="509" fill="#53685e" font-size="16" font-family="Arial,sans-serif">Esquema cualitativo; se omiten pérdidas y límites de adherencia para facilitar la lectura.</text>
</svg>
