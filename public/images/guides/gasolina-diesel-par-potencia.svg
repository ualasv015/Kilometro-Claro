<svg xmlns="http://www.w3.org/2000/svg" width="960" height="480" viewBox="0 0 960 480">
  <rect width="960" height="480" rx="20" fill="#173d34"/>
  <g font-family="Arial, sans-serif">
    <text x="48" y="68" fill="#fff" font-size="40" font-weight="700">Mismo par, distinta potencia</text>
    <text x="48" y="120" fill="#dcebe3" font-size="28">Ejemplo hipotético con 200 Nm constantes</text>
    <text x="48" y="224" fill="#fff" font-size="30">2.000 rpm</text>
    <text x="48" y="344" fill="#fff" font-size="30">4.000 rpm</text>
    <rect x="247" y="176" width="283" height="76" rx="8" fill="#d7f36a"/>
    <rect x="247" y="296" width="566" height="76" rx="8" fill="#d7f36a"/>
    <text x="275" y="225" fill="#173d34" font-size="32" font-weight="700">≈ 42 kW</text>
    <text x="275" y="345" fill="#173d34" font-size="32" font-weight="700">≈ 84 kW</text>
    <text x="48" y="433" fill="#dcebe3" font-size="24">Potencia (kW) ≈ par (Nm) × régimen (rpm) ÷ 9.550</text>
  </g>
</svg>
