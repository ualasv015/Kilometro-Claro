<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
<title id="title">Qué representa el par</title><desc id="desc">Una fuerza perpendicular aplicada al extremo de una llave produce un giro alrededor del eje de una tuerca. La distancia hasta el eje es el brazo de palanca.</desc>
<rect width="960" height="540" rx="24" fill="#f1f6f0"/><text x="46" y="61" fill="#173c32" font-size="31" font-family="Arial,sans-serif" font-weight="700">Par: fuerza que provoca giro</text><text x="46" y="94" fill="#53675b" font-size="18" font-family="Arial,sans-serif">La llave es una analogía: el eje del motor también entrega par</text>
<circle cx="248" cy="296" r="76" fill="#d8e8db" stroke="#266b54" stroke-width="6"/><circle cx="248" cy="296" r="24" fill="#fff" stroke="#266b54" stroke-width="5"/><path d="M292 271 L745 271 Q764 271 764 291 L764 316 Q764 336 745 336 L292 336 Z" fill="#8fad9e" stroke="#266b54" stroke-width="5"/><circle cx="248" cy="296" r="7" fill="#266b54"/>
<path d="M660 177v70" stroke="#80a927" stroke-width="10" stroke-linecap="round"/><path d="m660 260-18-22h36z" fill="#80a927"/><text x="683" y="205" fill="#315421" font-size="21" font-family="Arial,sans-serif" font-weight="700">Fuerza</text><path d="M248 377v32m0 0h412m0-32v32" fill="none" stroke="#5b7867" stroke-width="3"/><text x="454" y="440" fill="#365447" font-size="21" text-anchor="middle" font-family="Arial,sans-serif">Distancia hasta el eje = brazo</text><text x="181" y="190" fill="#365447" font-size="20" font-family="Arial,sans-serif">Eje de giro</text><path d="M247 200v-18" stroke="#5b7867" stroke-width="3"/>
<text x="46" y="502" fill="#53675b" font-size="17" font-family="Arial,sans-serif">Esquema original; solo muestra la idea de fuerza perpendicular por distancia.</text>
</svg>
