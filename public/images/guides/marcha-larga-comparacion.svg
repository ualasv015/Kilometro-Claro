<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
<title id="title">Dos marchas a la misma velocidad</title><desc id="desc">Comparación cualitativa de una marcha larga y otra más corta, ambas compatibles con la velocidad. Cambian las revoluciones del motor y la multiplicación de par de la caja.</desc>
<rect width="960" height="540" rx="24" fill="#f4f7f1"/><text x="48" y="64" fill="#153d34" font-size="30" font-family="Arial,sans-serif" font-weight="700">Mismo coche · misma velocidad</text><text x="48" y="96" fill="#52675e" font-size="18" font-family="Arial,sans-serif">Solo cambia la relación seleccionada; el par del motor también puede variar</text>
<rect x="44" y="131" width="418" height="322" rx="18" fill="#fff" stroke="#c7d8ca" stroke-width="2"/><rect x="498" y="131" width="418" height="322" rx="18" fill="#fff" stroke="#c7d8ca" stroke-width="2"/>
<text x="74" y="181" fill="#175748" font-size="27" font-family="Arial,sans-serif" font-weight="700">Marcha larga</text><text x="528" y="181" fill="#175748" font-size="27" font-family="Arial,sans-serif" font-weight="700">Marcha más corta</text>
<circle cx="105" cy="266" r="33" fill="#dceae0" stroke="#1c6853" stroke-width="4"/><circle cx="559" cy="266" r="33" fill="#dceae0" stroke="#1c6853" stroke-width="4"/><text x="92" y="274" fill="#15483d" font-size="20" font-family="Arial,sans-serif">M</text><text x="546" y="274" fill="#15483d" font-size="20" font-family="Arial,sans-serif">M</text>
<path d="M147 266h93m80 0h67" stroke="#70a223" stroke-width="9" stroke-linecap="round"/><path d="M601 266h93m80 0h67" stroke="#70a223" stroke-width="9" stroke-linecap="round"/><rect x="244" y="238" width="72" height="56" rx="9" fill="#d9ecbd" stroke="#70a223" stroke-width="3"/><rect x="698" y="238" width="72" height="56" rx="9" fill="#d9ecbd" stroke="#70a223" stroke-width="3"/><text x="260" y="274" fill="#284c1e" font-size="21" font-family="Arial,sans-serif" font-weight="700">Caja</text><text x="714" y="274" fill="#284c1e" font-size="21" font-family="Arial,sans-serif" font-weight="700">Caja</text><circle cx="403" cy="266" r="27" fill="#26392f"/><circle cx="857" cy="266" r="27" fill="#26392f"/><circle cx="403" cy="266" r="12" fill="#f4f7f1"/><circle cx="857" cy="266" r="12" fill="#f4f7f1"/>
<text x="74" y="338" fill="#243d32" font-size="20" font-family="Arial,sans-serif">Motor: menos revoluciones</text><text x="74" y="376" fill="#243d32" font-size="20" font-family="Arial,sans-serif">Caja: menor multiplicación</text><text x="528" y="338" fill="#243d32" font-size="20" font-family="Arial,sans-serif">Motor: más revoluciones</text><text x="528" y="376" fill="#243d32" font-size="20" font-family="Arial,sans-serif">Caja: mayor multiplicación</text>
<text x="48" y="498" fill="#52675e" font-size="17" font-family="Arial,sans-serif">Esquema ilustrativo: no predice la aceleración ni representa una caja concreta.</text>
</svg>
