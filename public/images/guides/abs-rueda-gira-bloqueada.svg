<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
  <title id="title">Rueda que sigue girando frente a rueda bloqueada</title>
  <desc id="desc">Esquema simplificado: a la izquierda una rueda gira durante la frenada y conserva posibilidad de transmitir fuerza lateral; a la derecha una rueda bloqueada desliza. Abajo, el ABS vigila el giro y regula la presión de freno.</desc>
  <rect width="960" height="540" rx="22" fill="#f4f7f1"/>
  <text x="48" y="55" font-family="Arial,sans-serif" font-size="27" font-weight="700" fill="#173f36">Dos respuestas de la rueda al frenar</text>
  <rect x="42" y="86" width="422" height="292" rx="16" fill="#e3eee8"/>
  <rect x="496" y="86" width="422" height="292" rx="16" fill="#f6ebe3"/>
  <text x="70" y="126" font-family="Arial,sans-serif" font-size="21" font-weight="700" fill="#155c4a">Sigue girando</text>
  <text x="524" y="126" font-family="Arial,sans-serif" font-size="21" font-weight="700" fill="#874523">Bloqueada y deslizando</text>
  <line x1="75" y1="315" x2="430" y2="315" stroke="#6f7d70" stroke-width="7"/>
  <line x1="529" y1="315" x2="884" y2="315" stroke="#6f7d70" stroke-width="7"/>
  <circle cx="260" cy="235" r="77" fill="#243c3a" stroke="#0c2926" stroke-width="8"/>
  <circle cx="260" cy="235" r="44" fill="#d2dad3"/>
  <path d="M260 193v84 M218 235h84" stroke="#7c9b8b" stroke-width="8"/>
  <path d="M344 175a100 100 0 0 1 4 114" fill="none" stroke="#188260" stroke-width="7" stroke-linecap="round"/>
  <path d="m349 289-18-7 16-13" fill="#188260"/>
  <circle cx="700" cy="235" r="77" fill="#243c3a" stroke="#0c2926" stroke-width="8"/>
  <circle cx="700" cy="235" r="44" fill="#d2dad3"/>
  <path d="M700 193v84 M658 235h84" stroke="#7c9b8b" stroke-width="8"/>
  <path d="M807 252h50 M811 270h37 M818 288h25" stroke="#b45c30" stroke-width="6" stroke-linecap="round"/>
  <text x="76" y="353" font-family="Arial,sans-serif" font-size="17" fill="#234e42">Puede responder al volante si hay agarre</text>
  <text x="523" y="353" font-family="Arial,sans-serif" font-size="17" fill="#764a33">Pierde mucha capacidad de guiar el coche</text>
  <rect x="42" y="402" width="876" height="100" rx="14" fill="#183f35"/>
  <text x="70" y="441" font-family="Arial,sans-serif" font-size="21" font-weight="700" fill="#f5f7f1">ABS: sensores → unidad de control → válvulas hidráulicas</text>
  <text x="70" y="472" font-family="Arial,sans-serif" font-size="18" fill="#d8e9da">Ajusta la presión para evitar el bloqueo; no crea adherencia.</text>
</svg>
