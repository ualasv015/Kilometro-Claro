<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
  <title id="title">El flujo de energía cambia al regenerar</title><desc id="desc">Al acelerar, la batería alimenta la electrónica, el motor y las ruedas. Al desacelerar con regeneración disponible, parte de la energía de movimiento vuelve desde las ruedas por el motor generador y la electrónica hasta la batería, con pérdidas en el recorrido.</desc>
  <rect width="960" height="540" rx="20" fill="#173d34"/>
  <g font-family="Arial,sans-serif"><text x="42" y="57" fill="#f5f8f1" font-size="32" font-weight="700">La dirección cambia; no vuelve todo</text><text x="42" y="91" fill="#c4d4cb" font-size="17">Esquema simplificado de un eléctrico que permite regenerar</text></g>
  <g font-family="Arial,sans-serif" text-anchor="middle" font-size="19" font-weight="700">
    <rect x="43" y="194" width="179" height="100" rx="13" fill="#d7f36a"/><text x="132" y="252" fill="#173d34">Batería</text>
    <rect x="271" y="194" width="179" height="100" rx="13" fill="#eaf2e3"/><text x="360" y="241" fill="#173d34">Electrónica</text><text x="360" y="267" fill="#173d34">de potencia</text>
    <rect x="499" y="194" width="179" height="100" rx="13" fill="#eaf2e3"/><text x="588" y="241" fill="#173d34">Motor /</text><text x="588" y="267" fill="#173d34">generador</text>
    <rect x="727" y="194" width="190" height="100" rx="13" fill="#d7f36a"/><text x="822" y="241" fill="#173d34">Ruedas y</text><text x="822" y="267" fill="#173d34">movimiento</text>
  </g>
  <g stroke="#d7f36a" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M84 150h792m-13-11 13 11-13 11"/><path d="M230 222h34m-11-10 11 10-11 10M458 222h34m-11-10 11 10-11 10M686 222h34m-11-10 11 10-11 10"/></g>
  <g stroke="#7dd4bc" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M876 345H84m13-11-13 11 13 11"/><path d="M720 266h-34m11-10-11 10 11 10M492 266h-34m11-10-11 10 11 10M264 266h-34m11-10-11 10 11 10"/></g>
  <g font-family="Arial,sans-serif" font-size="18" font-weight="700"><text x="42" y="132" fill="#d7f36a">ACELERAR</text><text x="42" y="385" fill="#7dd4bc">REGENERAR</text></g>
  <text x="42" y="431" fill="#f5f8f1" font-family="Arial,sans-serif" font-size="17">La recuperación exige desaceleración, capacidad de batería y agarre suficiente.</text>
  <text x="42" y="466" fill="#c4d4cb" font-family="Arial,sans-serif" font-size="16">Las conversiones y otras resistencias disipan parte de la energía como calor.</text>
  <text x="42" y="512" fill="#a9c2b1" font-family="Arial,sans-serif" font-size="14">Ilustración original de Kilómetro Claro · 2026</text>
</svg>
