<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
<title id="title">Curvas hipotéticas coherentes de par y potencia</title><desc id="desc">A 1000, 2000, 3000, 4000, 5000 y 6000 rpm el par hipotético es 100, 150, 180, 180, 160 y 120 Nm. La potencia correspondiente es 10,5, 31,4, 56,5, 75,4, 83,8 y 75,4 kW, calculada como par por rpm dividido entre 9550.</desc>
<rect width="960" height="540" rx="24" fill="#f3f7f1"/><text x="44" y="59" fill="#173c32" font-size="29" font-family="Arial,sans-serif" font-weight="700">Par y potencia: ejemplo hipotético</text><text x="44" y="89" fill="#53675b" font-size="17" font-family="Arial,sans-serif">Seis puntos calculados; las líneas sirven para unirlos visualmente</text>
<rect x="100" y="139" width="700" height="286" fill="#fff"/><g stroke="#d8e4da" stroke-width="2"><path d="M105 145h690M105 215h690M105 285h690M105 355h690M105 425h690"/></g><g stroke="#365e4e" stroke-width="3"><path d="M105 145v280h690"/></g>
<g fill="#465d50" font-family="Arial,sans-serif" font-size="16"><text x="67" y="430">0</text><text x="57" y="360">50</text><text x="47" y="290">100</text><text x="47" y="220">150</text><text x="47" y="150">200</text><text x="816" y="430">0</text><text x="816" y="360">25</text><text x="816" y="290">50</text><text x="816" y="220">75</text><text x="816" y="150">100</text></g><g fill="#465d50" font-family="Arial,sans-serif" font-size="15" text-anchor="middle"><text x="105" y="450">1.000</text><text x="243" y="450">2.000</text><text x="381" y="450">3.000</text><text x="519" y="450">4.000</text><text x="657" y="450">5.000</text><text x="795" y="450">6.000</text></g>
<text x="42" y="123" fill="#1b6d56" font-size="16" font-family="Arial,sans-serif" font-weight="700">Par · Nm</text><text x="792" y="123" fill="#9b572b" font-size="16" font-family="Arial,sans-serif" font-weight="700">Potencia · kW</text><text x="450" y="481" fill="#365447" font-size="17" font-family="Arial,sans-serif" text-anchor="middle">Régimen del motor · rpm</text>
<polyline points="105,285 243,215 381,173 519,173 657,201 795,257" fill="none" stroke="#1b8063" stroke-width="6" stroke-linejoin="round" stroke-linecap="round"/><polyline points="105,396 243,337 381,267 519,214 657,190 795,214" fill="none" stroke="#c66c35" stroke-width="6" stroke-linejoin="round" stroke-linecap="round"/><g fill="#1b8063"><circle cx="105" cy="285" r="6"/><circle cx="243" cy="215" r="6"/><circle cx="381" cy="173" r="6"/><circle cx="519" cy="173" r="6"/><circle cx="657" cy="201" r="6"/><circle cx="795" cy="257" r="6"/></g><g fill="#c66c35"><circle cx="105" cy="396" r="6"/><circle cx="243" cy="337" r="6"/><circle cx="381" cy="267" r="6"/><circle cx="519" cy="214" r="6"/><circle cx="657" cy="190" r="6"/><circle cx="795" cy="214" r="6"/></g>
<text x="350" y="157" fill="#1b6d56" font-size="17" font-family="Arial,sans-serif" font-weight="700">180 Nm</text><text x="667" y="176" fill="#9b572b" font-size="17" font-family="Arial,sans-serif" font-weight="700">83,8 kW</text><text x="44" y="513" fill="#53675b" font-size="16" font-family="Arial,sans-serif">No es una medición ni representa un motor real. Cada punto cumple P (kW) = Nm × rpm / 9.550.</text>
</svg>
