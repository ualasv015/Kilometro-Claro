  <path d="M60 408H900" stroke="#546b59" stroke-width="7"/>
  <path d="M220 345h520l-67-73H350l-60 73Z" fill="#173d34"/>
  <path d="M365 275h280l-42-57H420Z" fill="#4f7564"/>
  <circle cx="329" cy="400" r="42" fill="#182420" stroke="#d7f36a" stroke-width="10"/>
  <circle cx="639" cy="400" r="42" fill="#182420" stroke="#d7f36a" stroke-width="10"/>
  <path d="M754 316h124" stroke="#a94b3e" stroke-width="8" marker-end="url(#red)"/>
  <path d="M186 315H70" stroke="#23745d" stroke-width="8" marker-end="url(#green)"/>
