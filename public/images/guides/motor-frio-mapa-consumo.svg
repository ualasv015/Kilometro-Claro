<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="t d">
  <title id="t">Por qué un motor frío puede gastar más</title><desc id="d">Esquema editorial de tres factores: rozamiento, preparación de la mezcla y sistemas de emisiones. Todos confluyen en la energía necesaria durante el arranque y los primeros kilómetros.</desc>
  <rect width="960" height="540" rx="24" fill="#173d34"/><text x="52" y="68" fill="#f4f7f2" font-family="Arial,sans-serif" font-size="31" font-weight="bold">Al arrancar en frío</text>
  <g font-family="Arial,sans-serif" text-anchor="middle">
    <rect x="40" y="125" width="270" height="206" rx="16" fill="#e8f0e7"/><text x="175" y="181" fill="#173d34" font-size="27" font-weight="bold">Lubricación</text><text x="175" y="224" fill="#27483e" font-size="20">Aceite y otras piezas</text><text x="175" y="254" fill="#27483e" font-size="20">aún sin calentar</text>
    <rect x="345" y="125" width="270" height="206" rx="16" fill="#e8f0e7"/><text x="480" y="181" fill="#173d34" font-size="27" font-weight="bold">Combustión</text><text x="480" y="224" fill="#27483e" font-size="20">La gestión adapta</text><text x="480" y="254" fill="#27483e" font-size="20">el arranque</text>
    <rect x="650" y="125" width="270" height="206" rx="16" fill="#e8f0e7"/><text x="785" y="181" fill="#173d34" font-size="27" font-weight="bold">Escape</text><text x="785" y="224" fill="#27483e" font-size="20">Catalizador y otros</text><text x="785" y="254" fill="#27483e" font-size="20">sistemas se calientan</text>
    <path d="M175 333v44m305-44v44m305-44v44" stroke="#d7f36a" stroke-width="7"/><path d="m165 366 10 15 10-15m285 0 10 15 10-15m285 0 10 15 10-15" fill="none" stroke="#d7f36a" stroke-width="7"/>
    <rect x="114" y="397" width="732" height="81" rx="15" fill="#d7f36a"/><text x="480" y="446" fill="#173d34" font-size="25" font-weight="bold">El resultado depende del coche y del recorrido</text>
  </g>
</svg>
