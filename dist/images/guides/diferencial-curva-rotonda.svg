<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
  <title id="title">Dos ruedas motrices recorren arcos distintos en una curva</title>
  <desc id="desc">Vista superior simplificada de un coche de propulsión trasera. La rueda exterior sigue un arco más largo que la interior y ambas se conectan al diferencial mediante palieres.</desc>
  <rect width="960" height="540" rx="24" fill="#f3f6ee"/>
  <path d="M 460 150 A 360 360 0 0 0 100 510" fill="none" stroke="#d8e6ce" stroke-width="48"/>
  <path d="M 460 280 A 230 230 0 0 0 230 510" fill="none" stroke="#d8e6ce" stroke-width="48"/>
  <path d="M 460 150 A 360 360 0 0 0 100 510" fill="none" stroke="#176e5b" stroke-width="6" stroke-dasharray="13 10"/>
  <path d="M 460 280 A 230 230 0 0 0 230 510" fill="none" stroke="#a26927" stroke-width="6" stroke-dasharray="13 10"/>
  <path d="M460 150 L460 280" stroke="#193b35" stroke-width="10"/>
  <rect x="363" y="173" width="190" height="84" rx="26" fill="#dce8e4" stroke="#234e44" stroke-width="4"/>
  <path d="M384 185 L384 245 M430 185 L430 245" stroke="#92a9a0" stroke-width="3"/>
  <circle cx="460" cy="215" r="27" fill="#1d6652" stroke="#143f35" stroke-width="3"/>
  <circle cx="460" cy="215" r="8" fill="#f6f7ee"/>
  <rect x="426" y="137" width="68" height="26" rx="7" fill="#142f2d"/>
  <rect x="426" y="267" width="68" height="26" rx="7" fill="#142f2d"/>
  <path d="M360 214 L331 214" stroke="#1b5447" stroke-width="4" marker-end="url(#arrow)"/>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#1b5447"/></marker></defs>
  <text x="560" y="82" font-family="Arial,sans-serif" font-weight="700" font-size="24" fill="#1d4137">Giro visto desde arriba</text>
  <text x="560" y="149" font-family="Arial,sans-serif" font-size="20" fill="#176e5b">Rueda exterior</text>
  <text x="560" y="178" font-family="Arial,sans-serif" font-size="17" fill="#375f54">Arco más largo</text>
  <text x="560" y="280" font-family="Arial,sans-serif" font-size="20" fill="#8c551e">Rueda interior</text>
  <text x="560" y="309" font-family="Arial,sans-serif" font-size="17" fill="#66523a">Arco más corto</text>
  <text x="560" y="387" font-family="Arial,sans-serif" font-size="19" fill="#1d4137">Los palieres unen las ruedas</text>
  <text x="560" y="415" font-family="Arial,sans-serif" font-size="19" fill="#1d4137">con el diferencial central.</text>
  <text x="560" y="480" font-family="Arial,sans-serif" font-size="15" fill="#53675d">Esquema cualitativo · eje trasero motriz</text>
  <text x="237" y="205" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="#1d5447">Avance</text>
</svg>
