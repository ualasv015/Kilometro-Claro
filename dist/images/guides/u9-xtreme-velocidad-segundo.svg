<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 430" role="img" aria-labelledby="t d">
  <title id="t">Distancia recorrida en un segundo a 503,17 km/h</title>
  <desc id="d">Una escala ilustra 139,77 metros recorridos en un segundo si la velocidad se mantuviese constante.</desc>
  <rect width="960" height="430" rx="16" fill="#173d34"/>
  <text x="54" y="65" fill="#d7f36a" font-family="Arial,sans-serif" font-size="20" font-weight="700">503,17 km/h = 139,77 m/s</text>
  <text x="54" y="110" fill="#fff" font-family="Arial,sans-serif" font-size="27" font-weight="700">Casi 140 metros en un segundo</text>
  <path d="M72 238H888" stroke="#d7f36a" stroke-width="12" stroke-linecap="round"/>
  <path d="m870 223 22 15-22 15" fill="none" stroke="#d7f36a" stroke-width="8"/>
  <path d="M72 205v70M276 215v50M480 215v50M684 215v50M888 205v70" stroke="#fff" stroke-width="4"/>
  <g fill="#d9e5dc" font-family="Arial,sans-serif" font-size="17" text-anchor="middle"><text x="72" y="305">0 m</text><text x="276" y="305">35 m</text><text x="480" y="305">70 m</text><text x="684" y="305">105 m</text><text x="888" y="305">140 m</text></g>
  <text x="54" y="375" fill="#bccfc3" font-family="Arial,sans-serif" font-size="16">Conversión de velocidad; no representa distancia de frenado ni un tramo medido.</text>
</svg>
