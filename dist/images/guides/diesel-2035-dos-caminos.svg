<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="530" viewBox="0 0 1000 530" role="img" aria-labelledby="t d">
<title id="t">Dos preguntas diferentes para un coche diésel en 2035</title><desc id="d">Un coche ya matriculado requiere revisar ITV, distintivo y ordenanza local. Un coche nuevo depende de la oferta y las reglas de emisiones aplicables a los fabricantes.</desc>
<rect width="1000" height="530" rx="24" fill="#f5f9f3"/><text x="50" y="64" fill="#18372c" font-family="Arial,sans-serif" font-size="31" font-weight="700">2035: dos caminos distintos</text>
<rect x="50" y="105" width="425" height="355" rx="20" fill="#e4f2e4" stroke="#328257" stroke-width="3"/><rect x="525" y="105" width="425" height="355" rx="20" fill="#e9edf8" stroke="#426996" stroke-width="3"/>
<text x="78" y="152" fill="#18372c" font-family="Arial,sans-serif" font-size="25" font-weight="700">Ya tengo un diésel</text><text x="78" y="183" fill="#18372c" font-family="Arial,sans-serif" font-size="20">matriculado</text>
<text x="78" y="240" fill="#18372c" font-family="Arial,sans-serif" font-size="21">1. ITV y documentación</text><text x="78" y="286" fill="#18372c" font-family="Arial,sans-serif" font-size="21">2. Distintivo DGT</text><text x="78" y="332" fill="#18372c" font-family="Arial,sans-serif" font-size="21">3. Ordenanza del destino</text><text x="78" y="400" fill="#245a3b" font-family="Arial,sans-serif" font-size="18" font-weight="700">La fecha no ordena retirarlo.</text>
<text x="553" y="152" fill="#213b59" font-family="Arial,sans-serif" font-size="25" font-weight="700">Voy a comprar un coche</text><text x="553" y="183" fill="#213b59" font-family="Arial,sans-serif" font-size="20">nuevo</text>
<text x="553" y="240" fill="#213b59" font-family="Arial,sans-serif" font-size="21">1. Oferta disponible</text><text x="553" y="286" fill="#213b59" font-family="Arial,sans-serif" font-size="21">2. Norma europea vigente</text><text x="553" y="332" fill="#213b59" font-family="Arial,sans-serif" font-size="21">3. Uso local previsto</text><text x="553" y="400" fill="#345c8c" font-family="Arial,sans-serif" font-size="18" font-weight="700">La propuesta aún puede cambiar.</text>
<text x="50" y="500" fill="#3b5349" font-family="Arial,sans-serif" font-size="17">Esquema editorial · La etiqueta no garantiza acceso a todas las ZBE.</text></svg>
