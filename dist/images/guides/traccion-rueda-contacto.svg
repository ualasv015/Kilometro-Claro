<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
<title id="title">Rueda motriz y límite de adherencia</title><desc id="desc">Una rueda motriz recibe par de la transmisión. En el contacto empuja el firme hacia atrás y el suelo ejerce sobre ella una fuerza hacia delante, limitada por el agarre disponible.</desc>
<rect width="960" height="540" rx="24" fill="#f1f6ef"/><text x="43" y="58" fill="#193e34" font-size="30" font-family="Arial,sans-serif" font-weight="700">La rueda gira; el suelo decide cuánto empuje admite</text><text x="43" y="91" fill="#53675d" font-size="18" font-family="Arial,sans-serif">Ejemplo conceptual de una rueda motriz sobre gravilla</text>
<rect x="0" y="395" width="960" height="145" fill="#c5bdac"/><path d="M0 395h960" stroke="#827866" stroke-width="6"/><g fill="#8e836e"><circle cx="93" cy="421" r="7"/><circle cx="170" cy="445" r="5"/><circle cx="723" cy="419" r="7"/><circle cx="838" cy="455" r="5"/><circle cx="578" cy="465" r="6"/><circle cx="261" cy="473" r="6"/></g>
<circle cx="469" cy="260" r="133" fill="#263a34"/><circle cx="469" cy="260" r="95" fill="#384b42" stroke="#a9b8a6" stroke-width="8"/><circle cx="469" cy="260" r="58" fill="#d6dfd4"/><circle cx="469" cy="260" r="17" fill="#56705e"/><path d="M405 312l-32 47m59-29-23 54m113-55 24 54m24-72 31 48" stroke="#acb6a7" stroke-width="8" stroke-linecap="round"/>
<path d="M568 159a135 135 0 0 1 34 105" fill="none" stroke="#7fa829" stroke-width="9" stroke-linecap="round"/><path d="m594 276-15-25 30-2z" fill="#7fa829"/><text x="650" y="174" fill="#375821" font-size="21" font-family="Arial,sans-serif" font-weight="700">Par de la transmisión</text><path d="M491 363H327" stroke="#bb6d36" stroke-width="9" stroke-linecap="round"/><path d="m308 363 26-15v30z" fill="#bb6d36"/><text x="92" y="331" fill="#8d4d28" font-size="20" font-family="Arial,sans-serif" font-weight="700">Rueda empuja el suelo</text><path d="M446 379h155" stroke="#1c8064" stroke-width="9" stroke-linecap="round"/><path d="m619 379-26-15v30z" fill="#1c8064"/><text x="638" y="346" fill="#16694f" font-size="20" font-family="Arial,sans-serif" font-weight="700">Suelo empuja el coche</text>
<text x="43" y="503" fill="#43574d" font-size="17" font-family="Arial,sans-serif">Si la demanda excede el agarre, el giro puede aumentar más que el avance.</text>
</svg>
